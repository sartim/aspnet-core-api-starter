site_name: ASP.NET Core API Starter
site_description: Production-oriented ASP.NET Core API starter with user-service and minimal profiles.
site_url: https://sartim.github.io/aspnet-core-api-starter/
repo_name: sartim/aspnet-core-api-starter
repo_url: https://github.com/sartim/aspnet-core-api-starter

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.tabs.link

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - API reference: API.md
  - Architecture: ARCHITECTURE.md
  - Database migrations: DATABASE_MIGRATIONS.md
  - Release checklist: RELEASE_CHECKLIST.md
  - Roadmap: ROADMAP.md
