groups:
  - name: aspnet-starter-slo
    rules:
      - record: aspnet_starter:availability_error_ratio:rate1h
        expr: |
          sum by (environment, service) (rate(aspnet_starter_errors_total[1h]))
          /
          clamp_min(sum by (environment, service) (rate(aspnet_starter_requests_total[1h])), 1)
      - record: aspnet_starter:availability_error_ratio:rate6h
        expr: |
          sum by (environment, service) (rate(aspnet_starter_errors_total[6h]))
          /
          clamp_min(sum by (environment, service) (rate(aspnet_starter_requests_total[6h])), 1)
      - alert: AspNetStarterFastErrorBudgetBurn
        expr: aspnet_starter:availability_error_ratio:rate1h > 0.0144
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Fast availability error-budget burn in {{ $labels.environment }}"
          runbook: "docs/INCIDENT_RESPONSE.md#high-error-rate"
      - alert: AspNetStarterSlowErrorBudgetBurn
        expr: aspnet_starter:availability_error_ratio:rate6h > 0.006
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Sustained availability error-budget burn in {{ $labels.environment }}"
          runbook: "docs/INCIDENT_RESPONSE.md#high-error-rate"
