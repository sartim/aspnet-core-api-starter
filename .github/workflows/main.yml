name: CI

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: read
  security-events: write
  pull_request:
    branches: ["main"]

jobs:
  quality:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore dependencies
        run: dotnet restore AspNetCoreApiStarter.sln
      - name: Validate generated starter profiles
        run: ./scripts/test-starter.sh
      - name: Check formatting
        run: dotnet format AspNetCoreApiStarter.sln --no-restore --verify-no-changes
      - name: Build with analyzers
        run: dotnet build AspNetCoreApiStarter.sln --configuration Release --no-restore
      - name: Test with coverage
        run: >-
          dotnet test tests/AspNetCoreApiStarter.Tests/AspNetCoreApiStarter.Tests.csproj
          --configuration Release --no-restore --verbosity normal
          --collect:"XPlat Code Coverage"
      - name: Check vulnerable packages
        run: >-
          dotnet list AspNetCoreApiStarter.sln package
          --vulnerable --include-transitive --source https://api.nuget.org/v3/index.json
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
