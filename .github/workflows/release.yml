name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install versioning tool
        run: dotnet tool install --tool-path "$RUNNER_TEMP/nbgv" --version 3.10.70 nbgv
      - name: Resolve version
        id: version
        run: echo "version=$($RUNNER_TEMP/nbgv/nbgv get-version -v SemVer2)" >> "$GITHUB_OUTPUT"
      - name: Restore and test
        run: dotnet test AspNetCoreApiStarter.sln --configuration Release
      - name: Tag and publish GitHub Release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="v${RELEASE_VERSION}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists."
            exit 0
          fi
          git tag --annotate "$tag" --message "Release $tag"
          git push origin "$tag"
          gh release create "$tag" --generate-notes --title "$tag"
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
      version: ${{ steps.publish.outputs.version }}

  publish-image:
    name: Publish immutable container image
    needs: release
    environment:
      name: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish versioned image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.release.outputs.version }}
            ghcr.io/${{ github.repository }}:${{ needs.release.outputs.version }}-${{ github.sha }}
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Record image digest
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          {
            echo "Release: ${RELEASE_TAG}"
            echo "Version: ${RELEASE_VERSION}"
            echo "Image: ${IMAGE}@${IMAGE_DIGEST}"
            echo "Version tag: ${IMAGE}:${RELEASE_VERSION}"
            echo "Commit tag: ${IMAGE}:${GITHUB_SHA}"
          } > image-metadata.txt
      - name: Upload image metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.release.outputs.version }}-image-metadata
          path: image-metadata.txt
      - name: Attach image metadata to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release.outputs.tag }}" image-metadata.txt --clobber
