name: Deployment drift monitor

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to verify
        required: true
        default: all
        type: choice
        options:
          - all
          - staging
          - production

permissions:
  attestations: read
  contents: read
  deployments: read
  issues: write
  packages: read

jobs:
  verify:
    name: Verify ${{ matrix.environment }} deployment
    if: github.event_name == 'schedule' || inputs.environment == 'all' || inputs.environment == matrix.environment
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check deployment drift and rollback readiness
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ENVIRONMENT: ${{ matrix.environment }}
        run: ./scripts/check-deployment-drift.sh "$REPOSITORY" "$ENVIRONMENT"
      - name: Open deduplicated drift alert
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          title="[deployment-drift] ${ENVIRONMENT} verification failed"
          existing="$(gh issue list --state open --limit 100 --json title | jq --arg title "$title" '[.[] | select(.title == $title)] | length')"
          if [[ "$existing" == "0" ]]; then
            gh issue create \
              --title "$title" \
              --body "Scheduled deployment verification failed for ${ENVIRONMENT}. Check run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} and resolve the drift or rollback-readiness issue."
          else
            echo "An open ${ENVIRONMENT} drift alert already exists."
          fi
