name: Docker Runtime

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    name: Compose migration and health smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start services and run migrations
        run: docker compose up -d --build
      - name: Wait for API health endpoint
        run: curl --fail --retry 30 --retry-all-errors --retry-delay 3 --retry-connrefused http://localhost:5070/api/v1/health
      - name: Verify Users and RBAC schema
        run: >-
          test "$(docker compose exec -T postgres psql -U shopuser -d shopdb
          -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public'
          AND table_name IN ('Users', 'Roles', 'Permissions', 'RolePermission');" | tr -d '[:space:]')" = "4"
      - name: Show service status
        if: always()
        run: docker compose ps
      - name: Show service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down --volumes
