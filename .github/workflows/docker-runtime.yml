name: Docker Runtime

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    name: Compose migration and health smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start services and run migrations
        run: docker compose up -d --build
      - name: Wait for API health endpoint
        run: curl --fail --retry 30 --retry-all-errors --retry-delay 3 --retry-connrefused http://localhost:5070/health/ready
      - name: Run performance and SLO smoke test
        run: ./scripts/performance-smoke.sh http://localhost:5070/health/live 40 1000
      - name: Verify Users and RBAC schema
        run: >-
          test "$(docker compose exec -T postgres psql -U shopuser -d shopdb
          -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public'
          AND table_name IN ('Users', 'Roles', 'Permissions', 'RolePermission', 'UserRoles');" | tr -d '[:space:]')" = "5"
      - name: Show service status
        if: always()
        run: docker compose ps
      - name: Show service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down --volumes

  otlp:
    name: OTLP collector export smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start services with OTLP collector
        run: docker compose -f docker-compose.yaml -f docker-compose.otel.yaml up -d --build
      - name: Generate telemetry
        run: curl --fail --retry 30 --retry-all-errors --retry-delay 3 --retry-connrefused http://localhost:5070/health/ready
      - name: Verify collector received telemetry
        run: |
          for attempt in $(seq 1 20); do
            collector_logs="$(docker compose -f docker-compose.yaml -f docker-compose.otel.yaml logs otel-collector 2>&1)"
            if printf '%s\n' "$collector_logs" | grep -q 'otelcol.signal.*traces' && \
              printf '%s\n' "$collector_logs" | grep -q 'otelcol.signal.*metrics'; then
              exit 0
            fi
            sleep 3
          done
          docker compose -f docker-compose.yaml -f docker-compose.otel.yaml logs --no-color
          exit 1
      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.yaml -f docker-compose.otel.yaml down --volumes
