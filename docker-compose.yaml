services:
  postgres:
    image: postgres:15
    container_name: postgres
    env_file:
      - path: ./.env.example
      - path: ./.env
        required: false
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    container_name: asp_shop_migrate
    working_dir: /source/AspNetCoreApiStarter
    env_file:
      - path: ./.env.example
      - path: ./.env
        required: false
    volumes:
      - ./AspNetCoreApiStarter:/source/AspNetCoreApiStarter
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        dotnet tool install --global dotnet-ef --version 8.0.10 &&
        export PATH="$PATH:/root/.dotnet/tools" &&
        dotnet restore &&
        dotnet ef migrations list &&
        dotnet ef database update
  
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: asp_shop_api
    env_file:
      - path: ./.env.example
      - path: ./.env
        required: false
    ports:
      - "5070:5070"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data: {} 
